spring:
  application:
    name: simple-similarity-finder
  main:
    banner-mode: off
    web-application-type: none
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text

logging:
  level:
    root: error
    io.netty.util.NetUtilInitializations: off

similarity-finder:
  csv-path: classpath:test-cases.csv
  embedding-cache-path: data/test-case-embeddings.json
  result-limit: 10
  semantic-weight: 0.65
  lexical-weight: 0.35
  minimum-score: 0.50
  show-score-details: true
